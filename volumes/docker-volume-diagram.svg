<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <!-- Host machine outer boundary -->
  <rect x="20" y="20" width="680" height="340" rx="14" fill="#f7f9fb" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="40" y="50" font-size="15" font-weight="600" fill="#475569">Host Machine</text>

  <!-- Container A -->
  <rect x="60" y="90" width="190" height="110" rx="10" fill="#e8f3fc" stroke="#0db7ed" stroke-width="2"/>
  <text x="155" y="120" font-size="15" font-weight="600" fill="#0b6e99" text-anchor="middle">Container A</text>
  <text x="155" y="142" font-size="12" fill="#0b6e99" text-anchor="middle">ubuntu bash</text>
  <rect x="90" y="155" width="130" height="28" rx="5" fill="#ffffff" stroke="#0db7ed" stroke-width="1.5"/>
  <text x="155" y="173" font-size="12" fill="#0b6e99" text-anchor="middle">/data</text>

  <!-- Container B -->
  <rect x="470" y="90" width="190" height="110" rx="10" fill="#e8f3fc" stroke="#0db7ed" stroke-width="2"/>
  <text x="565" y="120" font-size="15" font-weight="600" fill="#0b6e99" text-anchor="middle">Container B</text>
  <text x="565" y="142" font-size="12" fill="#0b6e99" text-anchor="middle">ubuntu bash</text>
  <rect x="500" y="155" width="130" height="28" rx="5" fill="#ffffff" stroke="#0db7ed" stroke-width="1.5"/>
  <text x="565" y="173" font-size="12" fill="#0b6e99" text-anchor="middle">/data</text>

  <!-- Docker Volume -->
  <g>
    <rect x="280" y="250" width="160" height="90" rx="10" fill="#fef3e2" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="360" cy="262" rx="80" ry="10" fill="#fde6c2" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="360" y="298" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">myvolume</text>
    <text x="360" y="318" font-size="11" fill="#92400e" text-anchor="middle">/var/lib/docker/volumes/...</text>
  </g>

  <!-- Arrows: Container A -> Volume -->
  <path d="M155 200 C 155 240, 280 250, 300 255" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="230" font-size="11" fill="#475569">mount</text>

  <!-- Arrows: Container B -> Volume -->
  <path d="M565 200 C 565 240, 440 250, 420 255" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="230" font-size="11" fill="#475569">mount</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Caption -->
  <text x="360" y="365" font-size="12" fill="#64748b" text-anchor="middle">Both containers mount the same named volume, so data written by one is visible to the other and survives container removal.</text>
</svg>
