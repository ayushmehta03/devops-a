version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - '6379:6379'
    networks:
      - app-network

  web1:
    build: ./web
    hostname: web1
    restart: on-failure
    ports:
      - '81:5000'
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network

  web2:
    build: ./web
    hostname: web2
    restart: on-failure
    ports:
      - '82:5000'
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network

  nginx:
    build: ./nginx
    ports:
      - '80:80'
    depends_on:
      - web1
      - web2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge