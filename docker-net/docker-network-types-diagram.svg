<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <!-- ===================== Panel 1: Default Bridge ===================== -->
  <g>
    <rect x="20" y="20" width="260" height="400" rx="14" fill="#f7f9fb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="48" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Default Bridge</text>
    <text x="150" y="65" font-size="11" fill="#64748b" text-anchor="middle">(docker0)</text>

    <!-- docker0 bus -->
    <rect x="55" y="220" width="190" height="22" rx="6" fill="#fde6c2" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="150" y="236" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">docker0 (virtual eth)</text>

    <!-- Container A -->
    <rect x="65" y="110" width="170" height="80" rx="8" fill="#e8f3fc" stroke="#0db7ed" stroke-width="2"/>
    <text x="150" y="140" font-size="12" font-weight="600" fill="#0b6e99" text-anchor="middle">Container 1</text>
    <text x="150" y="158" font-size="10" fill="#0b6e99" text-anchor="middle">eth0</text>
    <line x1="150" y1="190" x2="150" y2="220" stroke="#475569" stroke-width="2"/>

    <!-- Container B -->
    <rect x="65" y="270" width="170" height="80" rx="8" fill="#e8f3fc" stroke="#0db7ed" stroke-width="2"/>
    <text x="150" y="300" font-size="12" font-weight="600" fill="#0b6e99" text-anchor="middle">Container 2</text>
    <text x="150" y="318" font-size="10" fill="#0b6e99" text-anchor="middle">eth0</text>
    <line x1="150" y1="270" x2="150" y2="242" stroke="#475569" stroke-width="2"/>

    <text x="150" y="395" font-size="10" fill="#64748b" text-anchor="middle">All containers share one</text>
    <text x="150" y="408" font-size="10" fill="#64748b" text-anchor="middle">bridge — can talk freely</text>
  </g>

  <!-- ===================== Panel 2: Custom Bridge ===================== -->
  <g>
    <rect x="320" y="20" width="260" height="400" rx="14" fill="#f7f9fb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="450" y="48" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Custom Bridge</text>
    <text x="450" y="65" font-size="11" fill="#64748b" text-anchor="middle">(isolated network)</text>

    <!-- custom net bus -->
    <rect x="345" y="220" width="170" height="22" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="430" y="236" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">network_name</text>

    <!-- Container A -->
    <rect x="345" y="110" width="170" height="80" rx="8" fill="#e8f3fc" stroke="#0db7ed" stroke-width="2"/>
    <text x="430" y="140" font-size="12" font-weight="600" fill="#0b6e99" text-anchor="middle">Container 1</text>
    <text x="430" y="158" font-size="10" fill="#0b6e99" text-anchor="middle">eth0</text>
    <line x1="430" y1="190" x2="430" y2="220" stroke="#475569" stroke-width="2"/>

    <!-- Container B -->
    <rect x="345" y="270" width="170" height="80" rx="8" fill="#e8f3fc" stroke="#0db7ed" stroke-width="2"/>
    <text x="430" y="300" font-size="12" font-weight="600" fill="#0b6e99" text-anchor="middle">Container 2</text>
    <text x="430" y="318" font-size="10" fill="#0b6e99" text-anchor="middle">eth0</text>
    <line x1="430" y1="270" x2="430" y2="242" stroke="#475569" stroke-width="2"/>

    <!-- isolation boundary -->
    <rect x="330" y="100" width="200" height="260" rx="10" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4"/>

    <text x="430" y="395" font-size="10" fill="#64748b" text-anchor="middle">Isolated from other</text>
    <text x="430" y="408" font-size="10" fill="#64748b" text-anchor="middle">networks — secure by design</text>
  </g>

  <!-- ===================== Panel 3: Host Network ===================== -->
  <g>
    <rect x="620" y="20" width="260" height="400" rx="14" fill="#f7f9fb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="750" y="48" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Host Network</text>
    <text x="750" y="65" font-size="11" fill="#64748b" text-anchor="middle">(binds to eth0)</text>

    <!-- host eth0 -->
    <rect x="645" y="290" width="210" height="26" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="750" y="307" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">host eth0</text>

    <!-- Container -->
    <rect x="660" y="140" width="180" height="100" rx="8" fill="#e8f3fc" stroke="#0db7ed" stroke-width="2"/>
    <text x="750" y="175" font-size="12" font-weight="600" fill="#0b6e99" text-anchor="middle">Container</text>
    <text x="750" y="195" font-size="10" fill="#0b6e99" text-anchor="middle">no separate eth0</text>
    <text x="750" y="212" font-size="10" fill="#0b6e99" text-anchor="middle">(uses host's directly)</text>

    <line x1="750" y1="240" x2="750" y2="290" stroke="#475569" stroke-width="2"/>

    <text x="750" y="345" font-size="10" fill="#64748b" text-anchor="middle">Fast, but no network</text>
    <text x="750" y="358" font-size="10" fill="#64748b" text-anchor="middle">isolation from the host</text>
  </g>
</svg>
